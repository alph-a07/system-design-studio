name: CI & Integrity Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Verify Skill Suite & Scaffolding
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify SKILL.md Standard
        run: |
          LINE_COUNT=$(wc -l < skills/system-design-studio/SKILL.md)
          echo "SKILL.md line count: $LINE_COUNT"
          if [ "$LINE_COUNT" -gt 500 ]; then
            echo "Error: SKILL.md exceeds 500 lines rule ($LINE_COUNT lines)"
            exit 1
          fi
          for s in skills/sds-*/SKILL.md; do
            count=$(wc -l < "$s")
            echo "$s line count: $count"
            if [ "$count" -gt 500 ]; then
              echo "Error: $s exceeds 500 lines ($count lines)"
              exit 1
            fi
          done

      - name: Test Fresh Scaffolding & Verification
        run: |
          chmod +x skills/system-design-studio/scripts/*
          mkdir -p /tmp/test-instance && cd /tmp/test-instance
          $GITHUB_WORKSPACE/skills/system-design-studio/scripts/init-learning-instance.sh "CI Test Instance"
          python3 $GITHUB_WORKSPACE/skills/system-design-studio/scripts/verify-instance.py .system-design

      - name: Test State Advance & Lineage
        run: |
          cd /tmp/test-instance
          python3 $GITHUB_WORKSPACE/skills/system-design-studio/scripts/advance-cursor.py \
            --complete-topic topic.0.1.tcp-vs-udp \
            --evidence "CI Verified Topic 1.1" \
            --log-example-domain "Financial Ledger" \
            --log-example-scenario "CI payment retry trace" \
            --next-topic-id topic.0.1.http-1-1-vs-http-2-vs-http-3 \
            --next-action "CI next action test"
          python3 $GITHUB_WORKSPACE/skills/system-design-studio/scripts/sync-status.py .system-design
          python3 $GITHUB_WORKSPACE/skills/system-design-studio/scripts/verify-instance.py .system-design

      - name: Test Multi-Project Management & Safe Deletion
        run: |
          cd /tmp/test-instance
          python3 $GITHUB_WORKSPACE/skills/system-design-studio/scripts/manage-projects.py list
          python3 $GITHUB_WORKSPACE/skills/system-design-studio/scripts/manage-projects.py delete --dry-run "ci-test-instance"
          python3 $GITHUB_WORKSPACE/skills/system-design-studio/scripts/manage-projects.py delete -f --delete-notes "ci-test-instance"
          test ! -d /tmp/test-instance/.system-design

      - name: Test BYO Curriculum Import
        run: |
          mkdir -p /tmp/test-byo && cd /tmp/test-byo
          python3 $GITHUB_WORKSPACE/skills/system-design-studio/scripts/import-curriculum.py \
            --input $GITHUB_WORKSPACE/skills/system-design-studio/resources/custom-curriculum-example.md \
            --instance-dir .system-design
          python3 $GITHUB_WORKSPACE/skills/system-design-studio/scripts/verify-instance.py .system-design

      - name: Test Universal Cross-OS & Cross-Agent Installer
        run: |
          # 1. Test POSIX sh
          rm -rf /tmp/test-sh-home && mkdir -p /tmp/test-sh-home
          HOME=/tmp/test-sh-home sh $GITHUB_WORKSPACE/install.sh --all
          test -f /tmp/test-sh-home/.gemini/antigravity/skills/system-design-studio/SKILL.md
          test -f /tmp/test-sh-home/.claude/skills/system-design-studio/SKILL.md
          test -f /tmp/test-sh-home/.cursor/skills/system-design-studio/SKILL.md
          test -f /tmp/test-sh-home/.codex/skills/system-design-studio/SKILL.md
          test -f /tmp/test-sh-home/.agents/skills/system-design-studio/SKILL.md

          # 2. Test bash
          rm -rf /tmp/test-bash-home && mkdir -p /tmp/test-bash-home
          HOME=/tmp/test-bash-home bash $GITHUB_WORKSPACE/install.sh --all
          test -f /tmp/test-bash-home/.gemini/antigravity/skills/system-design-studio/SKILL.md

          # 3. Test dash (Debian/Ubuntu POSIX shell)
          if command -v dash >/dev/null 2>&1; then
            rm -rf /tmp/test-dash-home && mkdir -p /tmp/test-dash-home
            HOME=/tmp/test-dash-home dash $GITHUB_WORKSPACE/install.sh --all
            test -f /tmp/test-dash-home/.gemini/antigravity/skills/system-design-studio/SKILL.md
          fi

          # 4. Test piped execution (curl ... | bash)
          rm -rf /tmp/test-pipe-home && mkdir -p /tmp/test-pipe-home
          cat $GITHUB_WORKSPACE/install.sh | HOME=/tmp/test-pipe-home sh -s -- --all
          test -f /tmp/test-pipe-home/.gemini/antigravity/skills/system-design-studio/SKILL.md

      - name: Test In-Chat Slash Commands & Clean Uninstaller
        run: |
          rm -rf /tmp/test-un-home && mkdir -p /tmp/test-un-home
          HOME=/tmp/test-un-home bash $GITHUB_WORKSPACE/install.sh --all
          test -f /tmp/test-un-home/.gemini/antigravity/skills/sds-status/SKILL.md
          test -f /tmp/test-un-home/.gemini/antigravity/skills/sds-delete/SKILL.md
          test -f /tmp/test-un-home/.gemini/config/skills/sds-status/SKILL.md
          test -f /tmp/test-un-home/.claude/commands/sds-status.md
          test -f /tmp/test-un-home/.claude/commands/sds-delete.md
          test -f /tmp/test-un-home/.codex/prompts/sds-status.md
          test -f /tmp/test-un-home/.codex/prompts/sds-delete.md
          
          # Run non-interactive clean uninstaller
          HOME=/tmp/test-un-home bash $GITHUB_WORKSPACE/uninstall.sh -y
          test ! -d /tmp/test-un-home/.gemini/antigravity/skills/system-design-studio
          test ! -d /tmp/test-un-home/.gemini/antigravity/skills/sds-status
          test ! -d /tmp/test-un-home/.gemini/antigravity/skills/sds-delete
          test ! -f /tmp/test-un-home/.claude/commands/sds-status.md
          test ! -f /tmp/test-un-home/.claude/commands/sds-delete.md
          test ! -f /tmp/test-un-home/.codex/prompts/sds-status.md
          test ! -f /tmp/test-un-home/.codex/prompts/sds-delete.md
